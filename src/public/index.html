<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Meal Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&family=Jolly+Lodger&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <h1><span class="word-meal">Meal</span><span class="word-manager">Manager</span></h1>
    <p>Your recipe box, organized.</p>
    <nav class="site-nav">
      <a href="index.html" class="active">Recipes</a>
      <a href="add-recipe.html">Add a Recipe</a>
    </nav>
  </header>

  <main>
    <h2 class="section-title collapsible-title collapsed-by-default">
      Weekly Meal Plan <span class="collapse-arrow">▸</span>
    </h2>
    <div class="collapsible-body">
      <div id="meal-plan" class="card"></div>
      <button type="button" id="grocery-list-btn">Generate Grocery List</button>
      <div id="grocery-list"></div>
    </div>

    <h2 class="section-title collapsible-title collapsed-by-default">
      Your Recipes <span class="collapse-arrow">▸</span>
    </h2>
    <div class="collapsible-body">
    <div id="tag-filters"></div>
    <div id="recipes"></div>
    </div>

    <h2 class="section-title collapsible-title collapsed-by-default">
      Manage Tags <span class="collapse-arrow">▸</span>
    </h2>
    <div class="collapsible-body">
      <div id="tag-admin" class="card"></div>
      <form id="new-tag-form">
        <input type="text" id="new-tag-name" placeholder="New tag name" required />
        <button type="submit">Add Tag</button>
      </form>
      <p id="tag-error" class="error"></p>
    </div>

    <h2 class="section-title collapsible-title collapsed-by-default">
      What Can I Make? <span class="collapse-arrow">▸</span>
    </h2>
    <div class="collapsible-body">
      <form id="suggest-form" class="card">
        <label for="on-hand">Ingredients you have</label>
        <input type="text" id="on-hand" placeholder="e.g. eggs, flour, milk" />
        <button type="submit">Suggest Recipes</button>
      </form>
      <div id="suggestions"></div>
    </div>
  </main>

  <script>
    const recipesEl = document.getElementById("recipes");
    const tagFiltersEl = document.getElementById("tag-filters");
    const tagAdminEl = document.getElementById("tag-admin");
    const newTagForm = document.getElementById("new-tag-form");
    const tagErrorEl = document.getElementById("tag-error");
    let activeTagId = null;
    let allTags = [];

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function tagPills(tags, { clickable } = { clickable: false }) {
      return tags.map(t =>
        `<span class="tag${clickable && t.id === activeTagId ? " active" : ""}"${clickable ? ` data-filter-tag-id="${t.id}"` : ""}>${escapeHtml(t.name)}</span>`
      ).join("");
    }

    async function loadTags() {
      const res = await fetch("/api/tags");
      allTags = await res.json();
      renderTagFilters();
      renderTagAdmin();
    }

    function renderTagFilters() {
      tagFiltersEl.innerHTML = allTags.length
        ? `<strong>Filter by tag:</strong> ${tagPills(allTags, { clickable: true })}${activeTagId ? ` <span class="tag" data-filter-tag-id="">Clear</span>` : ""}`
        : "";
    }

    function renderTagAdmin() {
      tagAdminEl.innerHTML = allTags.length
        ? allTags.map(t => `
            <div class="tag-admin-row">
              <span>${escapeHtml(t.name)}</span>
              <button type="button" data-rename-tag-id="${t.id}">Rename</button>
              <button type="button" data-delete-tag-id="${t.id}">Delete</button>
            </div>
          `).join("")
        : "<em>No tags yet.</em>";
    }

    async function loadRecipes() {
      const url = activeTagId ? `/api/recipes?tagId=${activeTagId}` : "/api/recipes";
      const res = await fetch(url);
      const recipes = await res.json();
      recipesEl.innerHTML = recipes.map(r => `
        <div class="recipe">
          <button class="recipe-edit" data-edit-id="${r.id}" title="Edit recipe" aria-label="Edit recipe">&#9998;</button>
          <button class="recipe-delete" data-id="${r.id}" title="Delete recipe" aria-label="Delete recipe">&times;</button>
          <div class="recipe-thumb">${
            r.image_url
              ? `<img src="${escapeHtml(r.image_url)}" alt="${escapeHtml(r.title)}" />`
              : escapeHtml(r.title.charAt(0).toUpperCase())
          }</div>
          <div class="recipe-body">
            <h3>${escapeHtml(r.title)}</h3>
            <div>${tagPills(r.tags)}</div>
            <strong>Ingredients</strong>
            <pre>${escapeHtml(r.ingredients)}</pre>
            <strong>Instructions</strong>
            <pre>${escapeHtml(r.instructions)}</pre>
          </div>
        </div>
      `).join("");
      loadMealPlan();
    }

    tagFiltersEl.addEventListener("click", (e) => {
      if (e.target.matches("[data-filter-tag-id]")) {
        activeTagId = e.target.dataset.filterTagId ? Number(e.target.dataset.filterTagId) : null;
        renderTagFilters();
        loadRecipes();
      }
    });

    newTagForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      tagErrorEl.textContent = "";
      const nameInput = document.getElementById("new-tag-name");
      const res = await fetch("/api/tags", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ name: nameInput.value }),
      });
      if (!res.ok) {
        const { error } = await res.json();
        tagErrorEl.textContent = error;
        return;
      }
      nameInput.value = "";
      loadTags();
    });

    tagAdminEl.addEventListener("click", async (e) => {
      tagErrorEl.textContent = "";
      if (e.target.matches("[data-rename-tag-id]")) {
        const id = e.target.dataset.renameTagId;
        const current = allTags.find(t => t.id === Number(id));
        const name = prompt("Rename tag:", current.name);
        if (name === null) return;
        const res = await fetch(`/api/tags/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ name }),
        });
        if (!res.ok) {
          const { error } = await res.json();
          tagErrorEl.textContent = error;
          return;
        }
        loadTags();
        loadRecipes();
      } else if (e.target.matches("[data-delete-tag-id]")) {
        const id = e.target.dataset.deleteTagId;
        if (!confirm("Delete this tag? It will be removed from all recipes.")) return;
        await fetch(`/api/tags/${id}`, { method: "DELETE" });
        if (activeTagId === Number(id)) activeTagId = null;
        loadTags();
        loadRecipes();
      }
    });

    recipesEl.addEventListener("click", async (e) => {
      if (e.target.matches("button[data-id]")) {
        await fetch(`/api/recipes/${e.target.dataset.id}`, { method: "DELETE" });
        loadRecipes();
      } else if (e.target.matches("button[data-edit-id]")) {
        window.location.href = `add-recipe.html?editId=${e.target.dataset.editId}`;
      }
    });

    const suggestForm = document.getElementById("suggest-form");
    const suggestionsEl = document.getElementById("suggestions");

    suggestForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const onHand = document.getElementById("on-hand").value;
      if (!onHand.trim()) {
        suggestionsEl.innerHTML = "";
        return;
      }
      const res = await fetch(`/api/recipes/suggest?ingredients=${encodeURIComponent(onHand)}`);
      const { local, online, onlineError } = await res.json();

      const localHtml = local.length
        ? local.map(s => `
            <div class="suggestion">
              <h3>${escapeHtml(s.title)}</h3>
              <div class="match-score">${s.have.length}/${s.have.length + s.missing.length} ingredients on hand</div>
              <div>${tagPills(s.tags)}</div>
              ${s.have.map(line => `<div class="ingredient-line have">${escapeHtml(line)}</div>`).join("")}
              ${s.missing.map(line => `<div class="ingredient-line missing">${escapeHtml(line)}</div>`).join("")}
            </div>
          `).join("")
        : "<p>No recipes in your collection match those ingredients yet.</p>";

      const onlineHtml = onlineError
        ? `<p class="error">${escapeHtml(onlineError)}</p>`
        : online.length
          ? online.map(o => `
              <div class="suggestion online-suggestion">
                <a href="${o.url}" target="_blank" rel="noopener noreferrer">
                  ${o.image ? `<img src="${o.image}" alt="${escapeHtml(o.title)}" />` : ""}
                  <h3>${escapeHtml(o.title)}</h3>
                </a>
                <div class="match-score">${o.usedIngredientCount} matched &middot; ${o.missedIngredientCount} more needed</div>
                <button type="button" data-save-spoonacular-id="${o.id}">Save Recipe</button>
              </div>
            `).join("")
          : "<p>No online results (set SPOONACULAR_API_KEY on the server to enable this).</p>";

      suggestionsEl.innerHTML = `
        <h3 class="suggestions-subheading">From Your Recipes</h3>
        <div class="suggestions-grid">${localHtml}</div>
        <h3 class="suggestions-subheading">From the Web</h3>
        <div class="suggestions-grid">${onlineHtml}</div>
      `;
    });

    suggestionsEl.addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-save-spoonacular-id]");
      if (!btn) return;
      btn.disabled = true;
      btn.textContent = "Saving...";
      try {
        const res = await fetch(`/api/recipes/import/${btn.dataset.saveSpoonacularId}`, { method: "POST" });
        if (!res.ok) {
          const { error } = await res.json();
          alert(error || "Failed to save recipe");
          btn.disabled = false;
          btn.textContent = "Save Recipe";
          return;
        }
        const { alreadySaved } = await res.json();
        btn.textContent = alreadySaved ? "Already Saved" : "Saved!";
        loadRecipes();
      } catch (err) {
        alert("Failed to save recipe");
        btn.disabled = false;
        btn.textContent = "Save Recipe";
      }
    });

    const mealPlanEl = document.getElementById("meal-plan");

    document.querySelectorAll(".collapsible-title").forEach((title) => {
      const body = title.nextElementSibling;
      if (title.classList.contains("collapsed-by-default")) {
        body.classList.add("collapsed");
      } else {
        title.classList.add("expanded");
      }
      title.addEventListener("click", () => {
        body.classList.toggle("collapsed");
        title.classList.toggle("expanded", !body.classList.contains("collapsed"));
      });
    });

    async function loadMealPlan() {
      const [planRes, recipesRes] = await Promise.all([
        fetch("/api/meal-plan"),
        fetch("/api/recipes"),
      ]);
      const plan = await planRes.json();
      const allRecipes = (await recipesRes.json()).sort((a, b) => a.title.localeCompare(b.title));

      const dayCard = ({ day, recipe }) => `
        <div class="meal-plan-day${recipe ? "" : " empty"}">
          <div class="day-name">${escapeHtml(day)}</div>
          <div class="day-recipe">${recipe ? escapeHtml(recipe.title) : "No recipe planned"}</div>
          <select data-day="${escapeHtml(day)}">
            <option value="">— No recipe selected —</option>
            ${allRecipes.map(r => `
              <option value="${r.id}" ${recipe && recipe.id === r.id ? "selected" : ""}>${escapeHtml(r.title)}</option>
            `).join("")}
          </select>
        </div>
      `;

      const firstRow = plan.slice(0, 4);
      const secondRow = plan.slice(4);
      mealPlanEl.innerHTML = `
        <div class="meal-plan-calendar">
          <div class="meal-plan-week-row row-1">${firstRow.map(dayCard).join("")}</div>
          <div class="meal-plan-week-row row-2">${secondRow.map(dayCard).join("")}</div>
        </div>
      `;
    }

    mealPlanEl.addEventListener("change", async (e) => {
      if (!e.target.matches("select[data-day]")) return;
      const day = e.target.dataset.day;
      const recipeId = e.target.value;
      await fetch(`/api/meal-plan/${encodeURIComponent(day)}`, {
        method: "PUT",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ recipeId }),
      });
    });

    const groceryListBtn = document.getElementById("grocery-list-btn");
    const groceryListEl = document.getElementById("grocery-list");

    groceryListBtn.addEventListener("click", async () => {
      groceryListBtn.disabled = true;
      groceryListBtn.textContent = "Generating...";
      try {
        const res = await fetch("/api/meal-plan/grocery-list");
        const { items, recipes } = await res.json();
        groceryListEl.innerHTML = !items.length
          ? "<p>No recipes are planned for this week yet.</p>"
          : `
            <div class="card">
              <div class="suggestions-subheading">For: ${recipes.map(r => escapeHtml(r.title)).join(", ")}</div>
              <ul class="grocery-list-items">
                ${items.map(i => `<li><label><input type="checkbox" /> ${escapeHtml(i.text)}${i.count > 1 ? ` <span class="grocery-count">×${i.count}</span>` : ""}</label></li>`).join("")}
              </ul>
            </div>
          `;
      } finally {
        groceryListBtn.disabled = false;
        groceryListBtn.textContent = "Generate Grocery List";
      }
    });

    loadTags().then(loadRecipes);
  </script>
</body>
</html>
