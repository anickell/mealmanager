<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Meal Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&family=Jolly+Lodger&display=swap" rel="stylesheet" />
  <style>
    :root {
      --text: #333745;
      --highlight: #e63462;
      --lowlight: #c7efcf;
      --accent1: #fe5f55;
      --accent2: #eef5db;
    }
    * { box-sizing: border-box; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: var(--accent2);
      color: var(--text);
      margin: 0;
      padding: 0 0 3rem;
    }
    .site-header {
      background: white;
      color: var(--text);
      padding: 1.5rem 1rem;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .site-header h1 {
      margin: 0;
      font-family: "Irish Grover", cursive;
      font-weight: normal;
      font-size: 3rem;
      line-height: 1;
    }
    .site-header h1 .word-meal,
    .site-header h1 .word-manager {
      display: inline-block;
      -webkit-text-stroke: 1.5px #1a1a1a;
      text-shadow: 2px 2px 0 #1a1a1a;
    }
    .site-header h1 .word-meal {
      color: var(--lowlight);
      transform: rotate(-4deg);
      margin-right: -0.2rem;
    }
    .site-header h1 .word-manager {
      color: var(--highlight);
      font-size: 1.3em;
      transform: rotate(2deg);
    }
    .site-header p {
      margin: 0.5rem 0 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.95rem;
      color: #666;
    }
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }
    h2.section-title {
      font-family: "Jolly Lodger", cursive;
      font-weight: normal;
      font-size: 2.1rem;
      letter-spacing: 0.02em;
      margin: 1.2rem 0 0;
      padding-bottom: 0.4rem;
      border-bottom: 3px solid var(--highlight);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      width: 100%;
    }
    .collapsible-title { cursor: pointer; user-select: none; }
    .collapse-arrow { display: inline-block; transition: transform 0.15s; font-size: 0.7em; }
    .collapsible-title.expanded .collapse-arrow { transform: rotate(90deg); }
    .collapsible-body { margin-bottom: 1.2rem; }
    .collapsible-body.collapsed { display: none; }
    .card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      padding: 1.5rem;
    }
    form { display: flex; flex-direction: column; gap: 0.5rem; }
    label { font-family: "Helvetica Neue", Arial, sans-serif; font-weight: bold; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--accent1); margin-bottom: -0.3rem; }
    input, textarea {
      font-family: "Helvetica Neue", Arial, sans-serif;
      padding: 0.6rem;
      font-size: 1rem;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    textarea { min-height: 80px; }
    button {
      font-family: "Helvetica Neue", Arial, sans-serif;
      padding: 0.6rem 1.2rem;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      border: none;
      border-radius: 999px;
      background: var(--highlight);
      color: white;
      transition: background 0.15s;
    }
    button:hover { background: var(--accent1); }
    #cancel-btn { background: #ccc; color: var(--text); }
    #cancel-btn:hover { background: #bbb; }

    #recipes {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.2rem;
    }
    .recipe {
      background: white;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .recipe:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,0.15); }
    .recipe-thumb {
      background: linear-gradient(135deg, var(--highlight), var(--accent1));
      color: white;
      font-family: Georgia, serif;
      font-size: 2.5rem;
      font-weight: bold;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .recipe-body { padding: 1rem; flex: 1; display: flex; flex-direction: column; gap: 0.5rem; }
    .recipe h3 { margin: 0; font-size: 1.15rem; }
    .recipe strong { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; color: #888; }
    .recipe pre { white-space: pre-wrap; font-family: inherit; margin: 0.2rem 0 0; font-size: 0.9rem; }
    .recipe-actions { display: flex; gap: 0.5rem; margin-top: auto; padding-top: 0.5rem; }
    .recipe-actions button { flex: 1; font-size: 0.8rem; padding: 0.4rem; }
    .recipe-actions button[data-id] { background: #888; }
    .recipe-actions button[data-id]:hover { background: #666; }

    .tag {
      display: inline-block;
      font-family: "Helvetica Neue", Arial, sans-serif;
      background: var(--lowlight);
      color: var(--accent1);
      border: 1px solid var(--highlight);
      border-radius: 999px;
      padding: 0.15rem 0.7rem;
      margin: 0.15rem 0.3rem 0.15rem 0;
      font-size: 0.78rem;
      font-weight: bold;
      cursor: pointer;
    }
    .tag.active { background: var(--highlight); color: white; }
    #tag-filters { margin: 1rem 0 2rem; font-family: "Helvetica Neue", Arial, sans-serif; }
    #tag-checkboxes { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; border: 1px solid #ddd; border-radius: 6px; padding: 0.7rem; font-family: "Helvetica Neue", Arial, sans-serif; }
    #tag-checkboxes label { font-weight: normal; text-transform: none; display: flex; align-items: center; gap: 0.3rem; margin: 0; color: var(--text); font-size: 0.9rem; }
    .tag-admin-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; font-family: "Helvetica Neue", Arial, sans-serif; }
    .tag-admin-row span { flex: 1; font-weight: bold; }
    .tag-admin-row button { font-size: 0.75rem; padding: 0.3rem 0.7rem; }
    #new-tag-form { flex-direction: row; margin-top: 0.5rem; }
    #new-tag-form input { flex: 1; }
    .error { color: var(--accent1); font-size: 0.9rem; font-family: "Helvetica Neue", Arial, sans-serif; }

    .suggestions-subheading { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--accent1); margin: 1.5rem 0 0.6rem; }
    .suggestions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.2rem; }
    .suggestion { background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); padding: 1rem; }
    .suggestion h3 { margin: 0 0 0.4rem; font-size: 1.1rem; }
    .match-score { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.8rem; font-weight: bold; color: var(--accent1); }
    .ingredient-line { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.85rem; margin: 0.1rem 0; }
    .ingredient-line.have::before { content: "✓ "; color: #2a8f4c; }
    .ingredient-line.missing::before { content: "+ "; color: #999; }
    .ingredient-line.missing { color: #999; }
    .online-suggestion a { display: block; text-decoration: none; color: inherit; }
    .online-suggestion img { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; margin-bottom: 0.5rem; }
    .online-suggestion button { margin-top: 0.6rem; width: 100%; font-size: 0.85rem; }
    .online-suggestion button:disabled { background: #aaa; cursor: default; }

    .meal-plan-calendar {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      font-family: "Helvetica Neue", Arial, sans-serif;
    }
    .meal-plan-week-row {
      display: grid;
      gap: 0.75rem;
      width: 100%;
    }
    .meal-plan-week-row.row-1 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .meal-plan-week-row.row-2 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .meal-plan-day {
      background: var(--accent2);
      border: 1px solid #e2e2d8;
      border-radius: 8px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-height: 140px;
      min-width: 0;
      overflow: hidden;
    }
    .meal-plan-day.empty { background: #fafafa; }
    .meal-plan-day .day-name {
      font-weight: bold;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.03em;
      color: var(--highlight);
      border-bottom: 2px solid var(--highlight);
      padding-bottom: 0.35rem;
    }
    .meal-plan-day .day-recipe {
      flex: 1;
      font-size: 0.9rem;
      color: var(--text);
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .meal-plan-day.empty .day-recipe { color: #999; font-style: italic; }
    .meal-plan-day select {
      width: 100%;
      max-width: 100%;
      padding: 0.35rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    @media (max-width: 800px) {
      .meal-plan-week-row.row-1,
      .meal-plan-week-row.row-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 480px) {
      .meal-plan-week-row.row-1,
      .meal-plan-week-row.row-2 { grid-template-columns: 1fr; }
    }
    #grocery-list-btn { margin-top: 1rem; }
    #grocery-list { margin-top: 1rem; }
    .grocery-list-items { list-style: none; margin: 0.5rem 0 0; padding: 0; font-family: "Helvetica Neue", Arial, sans-serif; }
    .grocery-list-items li { padding: 0.3rem 0; border-bottom: 1px solid #eee; }
    .grocery-list-items li:last-child { border-bottom: none; }
    .grocery-list-items label { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
    .grocery-count { color: #999; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header class="site-header">
    <h1><span class="word-meal">Meal</span><span class="word-manager">Manager</span></h1>
    <p>Your recipe box, organized.</p>
  </header>

  <main>
    <h2 class="section-title collapsible-title collapsed-by-default">
      Weekly Meal Plan <span class="collapse-arrow">▸</span>
    </h2>
    <div class="collapsible-body">
      <div id="meal-plan" class="card"></div>
      <button type="button" id="grocery-list-btn">Generate Grocery List</button>
      <div id="grocery-list"></div>
    </div>

    <h2 class="section-title collapsible-title collapsed-by-default">
      Your Recipes <span class="collapse-arrow">▸</span>
    </h2>
    <div class="collapsible-body">
    <div id="tag-filters"></div>
    <div id="recipes"></div>
    </div>

    <h2 class="section-title collapsible-title collapsed-by-default">
      Add a Recipe <span class="collapse-arrow">▸</span>
    </h2>
    <div class="collapsible-body">
      <form id="recipe-form" class="card">
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="Recipe title" required />

        <label for="ingredients">Ingredients</label>
        <textarea id="ingredients" placeholder="Ingredients (one per line)" required></textarea>

        <label for="instructions">Instructions</label>
        <textarea id="instructions" placeholder="Instructions" required></textarea>

        <label>Tags</label>
        <div id="tag-checkboxes"><em>No tags yet — add one below.</em></div>

        <input type="hidden" id="edit-id" />
        <button type="submit" id="submit-btn">Add Recipe</button>
        <button type="button" id="cancel-btn" style="display:none">Cancel</button>
      </form>
    </div>

    <h2 class="section-title collapsible-title collapsed-by-default">
      Manage Tags <span class="collapse-arrow">▸</span>
    </h2>
    <div class="collapsible-body">
      <div id="tag-admin" class="card"></div>
      <form id="new-tag-form">
        <input type="text" id="new-tag-name" placeholder="New tag name" required />
        <button type="submit">Add Tag</button>
      </form>
      <p id="tag-error" class="error"></p>
    </div>

    <h2 class="section-title collapsible-title collapsed-by-default">
      What Can I Make? <span class="collapse-arrow">▸</span>
    </h2>
    <div class="collapsible-body">
      <form id="suggest-form" class="card">
        <label for="on-hand">Ingredients you have</label>
        <input type="text" id="on-hand" placeholder="e.g. eggs, flour, milk" />
        <button type="submit">Suggest Recipes</button>
      </form>
      <div id="suggestions"></div>
    </div>
  </main>

  <script>
    const form = document.getElementById("recipe-form");
    const recipesEl = document.getElementById("recipes");
    const tagFiltersEl = document.getElementById("tag-filters");
    const tagCheckboxesEl = document.getElementById("tag-checkboxes");
    const tagAdminEl = document.getElementById("tag-admin");
    const newTagForm = document.getElementById("new-tag-form");
    const tagErrorEl = document.getElementById("tag-error");
    let activeTagId = null;
    let allTags = [];
    let recipesById = {};

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function tagPills(tags, { clickable } = { clickable: false }) {
      return tags.map(t =>
        `<span class="tag${clickable && t.id === activeTagId ? " active" : ""}"${clickable ? ` data-filter-tag-id="${t.id}"` : ""}>${escapeHtml(t.name)}</span>`
      ).join("");
    }

    async function loadTags() {
      const res = await fetch("/api/tags");
      allTags = await res.json();
      renderTagFilters();
      renderTagCheckboxes();
      renderTagAdmin();
    }

    function renderTagFilters() {
      tagFiltersEl.innerHTML = allTags.length
        ? `<strong>Filter by tag:</strong> ${tagPills(allTags, { clickable: true })}${activeTagId ? ` <span class="tag" data-filter-tag-id="">Clear</span>` : ""}`
        : "";
    }

    function renderTagCheckboxes() {
      tagCheckboxesEl.innerHTML = allTags.length
        ? allTags.map(t => `
            <label><input type="checkbox" name="tagIds" value="${t.id}" /> ${escapeHtml(t.name)}</label>
          `).join("")
        : "<em>No tags yet — add one below.</em>";
    }

    function renderTagAdmin() {
      tagAdminEl.innerHTML = allTags.length
        ? allTags.map(t => `
            <div class="tag-admin-row">
              <span>${escapeHtml(t.name)}</span>
              <button type="button" data-rename-tag-id="${t.id}">Rename</button>
              <button type="button" data-delete-tag-id="${t.id}">Delete</button>
            </div>
          `).join("")
        : "<em>No tags yet.</em>";
    }

    async function loadRecipes() {
      const url = activeTagId ? `/api/recipes?tagId=${activeTagId}` : "/api/recipes";
      const res = await fetch(url);
      const recipes = await res.json();
      recipesEl.innerHTML = recipes.map(r => `
        <div class="recipe">
          <div class="recipe-thumb">${escapeHtml(r.title.charAt(0).toUpperCase())}</div>
          <div class="recipe-body">
            <h3>${escapeHtml(r.title)}</h3>
            <div>${tagPills(r.tags)}</div>
            <strong>Ingredients</strong>
            <pre>${escapeHtml(r.ingredients)}</pre>
            <strong>Instructions</strong>
            <pre>${escapeHtml(r.instructions)}</pre>
            <div class="recipe-actions">
              <button data-edit-id="${r.id}">Edit</button>
              <button data-id="${r.id}">Delete</button>
            </div>
          </div>
        </div>
      `).join("");
      recipesById = Object.fromEntries(recipes.map(r => [r.id, r]));
      loadMealPlan();
    }

    tagFiltersEl.addEventListener("click", (e) => {
      if (e.target.matches("[data-filter-tag-id]")) {
        activeTagId = e.target.dataset.filterTagId ? Number(e.target.dataset.filterTagId) : null;
        renderTagFilters();
        loadRecipes();
      }
    });

    newTagForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      tagErrorEl.textContent = "";
      const nameInput = document.getElementById("new-tag-name");
      const res = await fetch("/api/tags", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ name: nameInput.value }),
      });
      if (!res.ok) {
        const { error } = await res.json();
        tagErrorEl.textContent = error;
        return;
      }
      nameInput.value = "";
      loadTags();
    });

    tagAdminEl.addEventListener("click", async (e) => {
      tagErrorEl.textContent = "";
      if (e.target.matches("[data-rename-tag-id]")) {
        const id = e.target.dataset.renameTagId;
        const current = allTags.find(t => t.id === Number(id));
        const name = prompt("Rename tag:", current.name);
        if (name === null) return;
        const res = await fetch(`/api/tags/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ name }),
        });
        if (!res.ok) {
          const { error } = await res.json();
          tagErrorEl.textContent = error;
          return;
        }
        loadTags();
        loadRecipes();
      } else if (e.target.matches("[data-delete-tag-id]")) {
        const id = e.target.dataset.deleteTagId;
        if (!confirm("Delete this tag? It will be removed from all recipes.")) return;
        await fetch(`/api/tags/${id}`, { method: "DELETE" });
        if (activeTagId === Number(id)) activeTagId = null;
        loadTags();
        loadRecipes();
      }
    });

    const editIdInput = document.getElementById("edit-id");
    const submitBtn = document.getElementById("submit-btn");
    const cancelBtn = document.getElementById("cancel-btn");

    function resetForm() {
      form.reset();
      editIdInput.value = "";
      submitBtn.textContent = "Add Recipe";
      cancelBtn.style.display = "none";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = document.getElementById("title").value;
      const ingredients = document.getElementById("ingredients").value;
      const instructions = document.getElementById("instructions").value;
      const tagIds = Array.from(tagCheckboxesEl.querySelectorAll("input[name=tagIds]:checked")).map(el => el.value);
      const id = editIdInput.value;
      const params = new URLSearchParams({ title, ingredients, instructions });
      for (const tagId of tagIds) params.append("tagIds", tagId);
      await fetch(id ? `/api/recipes/${id}` : "/api/recipes", {
        method: id ? "PUT" : "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: params,
      });
      resetForm();
      loadRecipes();
    });

    cancelBtn.addEventListener("click", resetForm);

    recipesEl.addEventListener("click", async (e) => {
      if (e.target.matches("button[data-id]")) {
        await fetch(`/api/recipes/${e.target.dataset.id}`, { method: "DELETE" });
        loadRecipes();
      } else if (e.target.matches("button[data-edit-id]")) {
        const r = recipesById[e.target.dataset.editId];
        document.getElementById("title").value = r.title;
        document.getElementById("ingredients").value = r.ingredients;
        document.getElementById("instructions").value = r.instructions;
        const tagIdSet = new Set(r.tags.map(t => String(t.id)));
        tagCheckboxesEl.querySelectorAll("input[name=tagIds]").forEach(el => {
          el.checked = tagIdSet.has(el.value);
        });
        editIdInput.value = r.id;
        submitBtn.textContent = "Save Changes";
        cancelBtn.style.display = "inline-block";

        const addRecipeBody = form.closest(".collapsible-body");
        const addRecipeTitle = addRecipeBody.previousElementSibling;
        addRecipeBody.classList.remove("collapsed");
        addRecipeTitle.classList.add("expanded");
        addRecipeTitle.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    });

    const suggestForm = document.getElementById("suggest-form");
    const suggestionsEl = document.getElementById("suggestions");

    suggestForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const onHand = document.getElementById("on-hand").value;
      if (!onHand.trim()) {
        suggestionsEl.innerHTML = "";
        return;
      }
      const res = await fetch(`/api/recipes/suggest?ingredients=${encodeURIComponent(onHand)}`);
      const { local, online, onlineError } = await res.json();

      const localHtml = local.length
        ? local.map(s => `
            <div class="suggestion">
              <h3>${escapeHtml(s.title)}</h3>
              <div class="match-score">${s.have.length}/${s.have.length + s.missing.length} ingredients on hand</div>
              <div>${tagPills(s.tags)}</div>
              ${s.have.map(line => `<div class="ingredient-line have">${escapeHtml(line)}</div>`).join("")}
              ${s.missing.map(line => `<div class="ingredient-line missing">${escapeHtml(line)}</div>`).join("")}
            </div>
          `).join("")
        : "<p>No recipes in your collection match those ingredients yet.</p>";

      const onlineHtml = onlineError
        ? `<p class="error">${escapeHtml(onlineError)}</p>`
        : online.length
          ? online.map(o => `
              <div class="suggestion online-suggestion">
                <a href="${o.url}" target="_blank" rel="noopener noreferrer">
                  ${o.image ? `<img src="${o.image}" alt="${escapeHtml(o.title)}" />` : ""}
                  <h3>${escapeHtml(o.title)}</h3>
                </a>
                <div class="match-score">${o.usedIngredientCount} matched &middot; ${o.missedIngredientCount} more needed</div>
                <button type="button" data-save-spoonacular-id="${o.id}">Save Recipe</button>
              </div>
            `).join("")
          : "<p>No online results (set SPOONACULAR_API_KEY on the server to enable this).</p>";

      suggestionsEl.innerHTML = `
        <h3 class="suggestions-subheading">From Your Recipes</h3>
        <div class="suggestions-grid">${localHtml}</div>
        <h3 class="suggestions-subheading">From the Web</h3>
        <div class="suggestions-grid">${onlineHtml}</div>
      `;
    });

    suggestionsEl.addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-save-spoonacular-id]");
      if (!btn) return;
      btn.disabled = true;
      btn.textContent = "Saving...";
      try {
        const res = await fetch(`/api/recipes/import/${btn.dataset.saveSpoonacularId}`, { method: "POST" });
        if (!res.ok) {
          const { error } = await res.json();
          alert(error || "Failed to save recipe");
          btn.disabled = false;
          btn.textContent = "Save Recipe";
          return;
        }
        const { alreadySaved } = await res.json();
        btn.textContent = alreadySaved ? "Already Saved" : "Saved!";
        loadRecipes();
      } catch (err) {
        alert("Failed to save recipe");
        btn.disabled = false;
        btn.textContent = "Save Recipe";
      }
    });

    const mealPlanEl = document.getElementById("meal-plan");

    document.querySelectorAll(".collapsible-title").forEach((title) => {
      const body = title.nextElementSibling;
      if (title.classList.contains("collapsed-by-default")) {
        body.classList.add("collapsed");
      } else {
        title.classList.add("expanded");
      }
      title.addEventListener("click", () => {
        body.classList.toggle("collapsed");
        title.classList.toggle("expanded", !body.classList.contains("collapsed"));
      });
    });

    async function loadMealPlan() {
      const [planRes, recipesRes] = await Promise.all([
        fetch("/api/meal-plan"),
        fetch("/api/recipes"),
      ]);
      const plan = await planRes.json();
      const allRecipes = (await recipesRes.json()).sort((a, b) => a.title.localeCompare(b.title));

      const dayCard = ({ day, recipe }) => `
        <div class="meal-plan-day${recipe ? "" : " empty"}">
          <div class="day-name">${escapeHtml(day)}</div>
          <div class="day-recipe">${recipe ? escapeHtml(recipe.title) : "No recipe planned"}</div>
          <select data-day="${escapeHtml(day)}">
            <option value="">— No recipe selected —</option>
            ${allRecipes.map(r => `
              <option value="${r.id}" ${recipe && recipe.id === r.id ? "selected" : ""}>${escapeHtml(r.title)}</option>
            `).join("")}
          </select>
        </div>
      `;

      const firstRow = plan.slice(0, 4);
      const secondRow = plan.slice(4);
      mealPlanEl.innerHTML = `
        <div class="meal-plan-calendar">
          <div class="meal-plan-week-row row-1">${firstRow.map(dayCard).join("")}</div>
          <div class="meal-plan-week-row row-2">${secondRow.map(dayCard).join("")}</div>
        </div>
      `;
    }

    mealPlanEl.addEventListener("change", async (e) => {
      if (!e.target.matches("select[data-day]")) return;
      const day = e.target.dataset.day;
      const recipeId = e.target.value;
      await fetch(`/api/meal-plan/${encodeURIComponent(day)}`, {
        method: "PUT",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ recipeId }),
      });
    });

    const groceryListBtn = document.getElementById("grocery-list-btn");
    const groceryListEl = document.getElementById("grocery-list");

    groceryListBtn.addEventListener("click", async () => {
      groceryListBtn.disabled = true;
      groceryListBtn.textContent = "Generating...";
      try {
        const res = await fetch("/api/meal-plan/grocery-list");
        const { items, recipes } = await res.json();
        groceryListEl.innerHTML = !items.length
          ? "<p>No recipes are planned for this week yet.</p>"
          : `
            <div class="card">
              <div class="suggestions-subheading">For: ${recipes.map(r => escapeHtml(r.title)).join(", ")}</div>
              <ul class="grocery-list-items">
                ${items.map(i => `<li><label><input type="checkbox" /> ${escapeHtml(i.text)}${i.count > 1 ? ` <span class="grocery-count">×${i.count}</span>` : ""}</label></li>`).join("")}
              </ul>
            </div>
          `;
      } finally {
        groceryListBtn.disabled = false;
        groceryListBtn.textContent = "Generate Grocery List";
      }
    });

    loadTags().then(loadRecipes);
  </script>
</body>
</html>
